<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Blog Detay | FOKUS Emlak</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://static.fokusistatistik.com/resimler/fokusemlakfavicon.png">
    <link rel="apple-touch-icon" href="https://static.fokusistatistik.com/resimler/fokusemlakfavicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        /* Blog content typography styles */
        #blog-content {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            line-height: 1.8;
            color: #334155;
        }
        #blog-content h1 { @apply text-4xl font-bold text-slate-900 mt-8 mb-4; }
        #blog-content h2 { @apply text-3xl font-bold text-slate-900 mt-8 mb-4; }
        #blog-content h3 { @apply text-2xl font-bold text-slate-800 mt-6 mb-3; }
        #blog-content h4 { @apply text-xl font-semibold text-slate-800 mt-4 mb-2; }
        #blog-content h5 { @apply text-lg font-semibold text-slate-700 mt-4 mb-2; }
        #blog-content h6 { @apply text-base font-semibold text-slate-700 mt-4 mb-2; }
        #blog-content p { @apply mb-4 text-slate-600; }
        #blog-content a { @apply text-blue-600 hover:text-blue-800 underline; }
        #blog-content strong, #blog-content b { @apply font-semibold text-slate-900; }
        #blog-content em, #blog-content i { @apply italic; }
        #blog-content ul { @apply list-disc list-inside mb-4 space-y-2; }
        #blog-content ol { @apply list-decimal list-inside mb-4 space-y-2; }
        #blog-content li { @apply text-slate-600; }
        #blog-content blockquote { @apply border-l-4 border-blue-900 pl-4 py-2 my-4 bg-slate-50 italic text-slate-700; }
        #blog-content img { @apply rounded-lg my-6 w-full max-w-3xl mx-auto shadow-lg; }
        #blog-content code { @apply bg-slate-100 px-2 py-1 rounded text-sm font-mono text-red-600; }
        #blog-content pre { @apply bg-slate-900 text-slate-100 p-4 rounded-lg my-4 overflow-x-auto; }
        #blog-content pre code { @apply bg-transparent text-slate-100 p-0; }
        #blog-content table { @apply w-full border-collapse my-6; }
        #blog-content th { @apply bg-slate-100 border border-slate-300 px-4 py-2 text-left font-semibold; }
        #blog-content td { @apply border border-slate-300 px-4 py-2; }
        #blog-content hr { @apply my-8 border-slate-200; }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Simple Nav -->
    <nav class="bg-white border-b border-slate-200">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img src="https://static.fokusistatistik.com/resimler/fokusemlaklogo.png" alt="FOKUS Emlak" class="h-10 w-auto object-contain">
            </a>
            <a href="blog.html" class="text-slate-600 hover:text-blue-900"><i class="fa-solid fa-arrow-left mr-2"></i> Blog</a>
        </div>
    </nav>

    <div id="loading" class="container mx-auto px-4 py-12 text-center">
        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-900"></i>
        <p class="mt-4 text-slate-600">Blog yükleniyor...</p>
    </div>

    <div id="blog-container" class="hidden">
        <!-- Blog Header -->
        <div class="relative h-96 bg-cover bg-center" id="blog-header" style="background-image: url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=1200');">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/50 to-transparent"></div>
            <div class="absolute bottom-0 left-0 right-0 p-8 text-white">
                <div class="container mx-auto">
                    <span id="blog-category" class="inline-block bg-blue-600 px-4 py-1 rounded-full text-sm font-semibold mb-4">Kategori</span>
                    <h1 id="blog-title" class="text-4xl md:text-5xl font-bold mb-4">Blog Başlığı</h1>
                    <div class="flex items-center gap-6 text-sm text-slate-200">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-user-circle text-xl"></i>
                            <span id="blog-author">Yazar</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-calendar"></i>
                            <span id="blog-date">Tarih</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Blog Content -->
        <div class="container mx-auto px-4 py-12">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-8 md:p-12">
                    <!-- Excerpt -->
                    <div id="blog-excerpt" class="text-xl text-slate-700 font-medium mb-8 pb-8 border-b border-slate-200"></div>

                    <!-- Main Content (HTML Rendered) -->
                    <div id="blog-content" class="prose prose-slate max-w-none">
                        <!-- HTML content will be rendered here -->
                    </div>
                </div>

                <!-- Related Posts -->
                <div class="mt-12">
                    <h3 class="text-2xl font-bold text-slate-900 mb-6">İlgili Yazılar</h3>
                    <div id="related-posts" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Related posts will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        async function loadBlog() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                alert('Blog ID bulunamadı');
                window.location.href = 'blog.html';
                return;
            }

            try {
                // Try webhook first
                const response = await fetch(`https://n8n.fokusistatistik.com/webhook/blog/get/${id}`);
                let blog;

                if (response.ok) {
                    blog = await response.json();
                } else {
                    // Fallback to localStorage
                    const blogs = JSON.parse(localStorage.getItem('blogs') || '[]');
                    blog = blogs.find(b => b.id === id);
                }

                if (!blog) {
                    alert('Blog bulunamadı');
                    window.location.href = 'blog.html';
                    return;
                }

                displayBlog(blog);
                loadRelatedPosts(blog.category, id);

            } catch (error) {
                console.error('Error loading blog:', error);
                // Try localStorage as fallback
                const blogs = JSON.parse(localStorage.getItem('blogs') || '[]');
                const blog = blogs.find(b => b.id === id);

                if (blog) {
                    displayBlog(blog);
                    loadRelatedPosts(blog.category, id);
                } else {
                    alert('Blog yüklenirken hata oluştu');
                    window.location.href = 'blog.html';
                }
            }
        }

        function displayBlog(blog) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('blog-container').classList.remove('hidden');

            // Update meta
            document.getElementById('page-title').textContent = `${blog.title} | FOKUS Emlak`;

            // Update header
            if (blog.image) {
                document.getElementById('blog-header').style.backgroundImage = `url('${blog.image}')`;
            }

            document.getElementById('blog-category').textContent = getCategoryLabel(blog.category);
            document.getElementById('blog-title').textContent = blog.title;
            document.getElementById('blog-author').textContent = blog.author || 'FOKUS Emlak';
            document.getElementById('blog-date').textContent = formatDate(blog.date);

            // Update content
            document.getElementById('blog-excerpt').textContent = blog.excerpt || '';

            // IMPORTANT: Render HTML content (from admin panel HTML editor)
            document.getElementById('blog-content').innerHTML = blog.content || '';
        }

        function getCategoryLabel(category) {
            const labels = {
                'market': 'Piyasa Analizi',
                'guide': 'Rehber',
                'news': 'Haberler',
                'investment': 'Yatırım',
                'legal': 'Hukuki'
            };
            return labels[category] || 'Genel';
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function loadRelatedPosts(category, currentId) {
            try {
                let blogs = JSON.parse(localStorage.getItem('blogs') || '[]');
                const related = blogs
                    .filter(b => b.category === category && b.id !== currentId)
                    .slice(0, 3);

                if (related.length === 0) {
                    document.getElementById('related-posts').innerHTML = '<p class="text-slate-500 col-span-3 text-center">İlgili yazı bulunamadı</p>';
                    return;
                }

                document.getElementById('related-posts').innerHTML = related.map(blog => `
                    <a href="blog-detail.html?id=${blog.id}" class="block bg-white rounded-xl shadow border border-slate-200 overflow-hidden hover-lift">
                        <div class="h-40">
                            <img src="${blog.image || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400'}"
                                 class="w-full h-full object-cover"
                                 onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400'">
                        </div>
                        <div class="p-4">
                            <h4 class="font-bold text-slate-900 mb-2 line-clamp-2">${blog.title}</h4>
                            <p class="text-xs text-slate-500">${formatDate(blog.date)}</p>
                        </div>
                    </a>
                `).join('');
            } catch (error) {
                console.error('Error loading related posts:', error);
            }
        }

        // Load blog on page load
        loadBlog();
    </script>
</body>
</html>
