<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap / Kayıt Ol | FOKUS Emlak</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 antialiased">

    <div id="toast-container" class="fixed top-6 right-4 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full">
            <!-- Logo & Back -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center justify-center gap-2 group mb-4">
                    <div class="w-12 h-12 bg-blue-900 rounded-lg flex items-center justify-center text-white font-bold text-2xl group-hover:bg-amber-500 transition-colors">F</div>
                    <span class="text-3xl font-bold text-blue-900 tracking-tight">FOKUS<span class="text-amber-500">.</span></span>
                </a>
                <h2 class="text-3xl font-bold text-slate-900 mb-2">Hoş Geldiniz</h2>
                <p class="text-slate-500">Devam etmek için giriş yapın veya kayıt olun</p>
            </div>

            <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
                <!-- Tab Selector -->
                <div class="flex gap-2 mb-8 bg-slate-100 p-1 rounded-xl">
                    <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2.5 rounded-lg font-semibold text-sm transition bg-white shadow text-blue-900">
                        Giriş Yap
                    </button>
                    <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2.5 rounded-lg font-semibold text-sm transition text-slate-600">
                        Kayıt Ol
                    </button>
                </div>

                <!-- LOGIN FORM -->
                <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">E-posta</label>
                        <input type="email" name="email" required placeholder="ornek@email.com" class="form-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Şifre</label>
                        <input type="password" name="password" required placeholder="••••••••" class="form-input">
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-900 focus:ring-blue-900">
                            <span class="text-slate-600">Beni hatırla</span>
                        </label>
                        <a href="#" class="text-blue-900 font-semibold hover:text-blue-700">Şifremi unuttum</a>
                    </div>
                    <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3.5 rounded-xl hover:bg-blue-800 transition shadow-lg btn-primary">
                        Giriş Yap <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </form>

                <!-- REGISTER FORM -->
                <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-5 hidden">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Ad</label>
                            <input type="text" name="firstName" required placeholder="Adınız" class="form-input">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Soyad</label>
                            <input type="text" name="lastName" required placeholder="Soyadınız" class="form-input">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">E-posta</label>
                        <input type="email" name="email" required placeholder="ornek@email.com" class="form-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Telefon</label>
                        <input type="tel" name="phone" required placeholder="05XX XXX XX XX" class="form-input">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Şifre</label>
                        <input type="password" name="password" required placeholder="••••••••" minlength="6" class="form-input">
                    </div>
                    <div>
                        <label class="flex items-start gap-2 cursor-pointer text-sm">
                            <input type="checkbox" name="terms" required class="w-4 h-4 rounded border-slate-300 text-blue-900 focus:ring-blue-900 mt-0.5">
                            <span class="text-slate-600">
                                <a href="terms.html" class="text-blue-900 font-semibold">Kullanım Koşulları</a>'nı ve
                                <a href="privacy.html" class="text-blue-900 font-semibold">Gizlilik Politikası</a>'nı okudum, kabul ediyorum.
                            </span>
                        </label>
                    </div>
                    <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3.5 rounded-xl hover:bg-blue-800 transition shadow-lg btn-primary">
                        Kayıt Ol <i class="fa-solid fa-user-plus ml-2"></i>
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-slate-500 font-medium">veya</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="space-y-3">
                    <button onclick="handleGoogleLoginClick()" class="w-full flex items-center justify-center gap-3 border-2 border-slate-200 hover:border-slate-300 py-3 rounded-xl font-semibold text-slate-700 transition hover:bg-slate-50">
                        <i class="fa-brands fa-google text-xl text-red-500"></i>
                        Google ile Devam Et
                    </button>

                    <!-- TEST LOGIN (Development Only) -->
                    <div class="pt-4 border-t border-dashed border-slate-200">
                        <p class="text-xs text-amber-600 font-bold mb-2 text-center">
                            <i class="fa-solid fa-flask"></i> TEST MODU (Geliştirme)
                        </p>
                        <button onclick="handleTestLogin()" class="w-full flex items-center justify-center gap-2 bg-amber-50 border-2 border-amber-200 hover:border-amber-300 py-2.5 rounded-lg font-semibold text-amber-700 transition text-sm">
                            <i class="fa-solid fa-vial"></i>
                            Test Hesabı ile Gir
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-center mt-6">
                <a href="index.html" class="text-sm text-slate-600 hover:text-blue-900 font-medium">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Ana Sayfaya Dön
                </a>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-client.js"></script>
    <script src="/assets/js/supabase-client-users.js"></script>

    <!-- Legacy Scripts (fallback) -->
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/main.js"></script>

    <script>
        // Tab Switching
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.classList.add('bg-white', 'shadow', 'text-blue-900');
                loginTab.classList.remove('text-slate-600');
                registerTab.classList.remove('bg-white', 'shadow', 'text-blue-900');
                registerTab.classList.add('text-slate-600');
            } else {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                registerTab.classList.add('bg-white', 'shadow', 'text-blue-900');
                registerTab.classList.remove('text-slate-600');
                loginTab.classList.remove('bg-white', 'shadow', 'text-blue-900');
                loginTab.classList.add('text-slate-600');
            }
        }

        // Login Form Submit (UPDATED FOR SUPABASE)
        async function handleLoginSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Giriş yapılıyor...';

            const email = form.email.value;
            const password = form.password.value;

            try {
                // Use Supabase authentication
                const result = await SupabaseClient.signIn(email, password);

                if (result.success) {
                    // Get user profile to determine role
                    const userResult = await SupabaseClient.getCurrentUser();

                    if (userResult.success) {
                        const role = userResult.user.profile.role;
                        const name = userResult.user.profile.full_name;

                        showToast(`Hoşgeldiniz, ${name}!`, 'success');

                        // Redirect based on role
                        setTimeout(() => {
                            if (role === 'admin') {
                                window.location.href = '/admin/supabase-admin.html';
                            } else if (role === 'agent') {
                                window.location.href = '/agent-dashboard.html';
                            } else {
                                window.location.href = '/user-dashboard.html';
                            }
                        }, 1000);
                    } else {
                        // Default redirect
                        showToast('Giriş başarılı!', 'success');
                        setTimeout(() => {
                            window.location.href = '/user-dashboard.html';
                        }, 1000);
                    }
                } else {
                    throw new Error(result.error || 'Giriş başarısız');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast(error.message || 'Giriş yapılırken bir hata oluştu', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Register Form Submit (UPDATED FOR SUPABASE)
        async function handleRegisterSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Kayıt yapılıyor...';

            const userData = {
                full_name: `${form.firstName.value} ${form.lastName.value}`,
                email: form.email.value,
                phone: form.phone.value,
                password: form.password.value,
                role: 'user' // Default role
            };

            try {
                // Use Supabase signup
                const result = await SupabaseClient.signUp(
                    userData.email,
                    userData.password,
                    {
                        full_name: userData.full_name,
                        phone: userData.phone,
                        role: userData.role
                    }
                );

                if (result.success) {
                    showToast('Kayıt başarılı! Email adresinizi doğrulayın.', 'success');
                    setTimeout(() => {
                        switchTab('login');
                        showToast('Lütfen email adresinizi kontrol edin', 'info');
                    }, 2000);
                } else {
                    throw new Error(result.error || 'Kayıt başarısız');
                }
            } catch (error) {
                console.error('Register error:', error);
                showToast(error.message || 'Kayıt olurken bir hata oluştu', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Google Login (UPDATED FOR SUPABASE)
        async function handleGoogleLoginClick() {
            try {
                const result = await SupabaseClient.signInWithGoogle();

                if (!result.success && result.error) {
                    throw new Error(result.error);
                }
                // Google OAuth redirects automatically
            } catch (error) {
                console.error('Google login error:', error);
                showToast(error.message || 'Google girişi başarısız', 'error');
            }
        }

        // Test Login (Development) - REMOVED FOR PRODUCTION
        async function handleTestLogin() {
            showToast('Test modu kullanılamıyor. Lütfen gerçek hesap ile giriş yapın.', 'info');
        }

        // Check if already logged in
        async function checkAuth() {
            const { session } = await SupabaseClient.getSession();
            if (session) {
                const userResult = await SupabaseClient.getCurrentUser();
                if (userResult.success) {
                    const role = userResult.user.profile.role;
                    if (role === 'admin') {
                        window.location.href = '/admin/supabase-admin.html';
                    } else if (role === 'agent') {
                        window.location.href = '/agent-dashboard.html';
                    } else {
                        window.location.href = '/user-dashboard.html';
                    }
                }
            }
        }

        // Run auth check on page load
        window.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });

        // Handle OAuth redirect
        window.addEventListener('hashchange', async () => {
            if (window.location.hash.includes('access_token')) {
                const { session } = await SupabaseClient.getSession();
                if (session) {
                    checkAuth();
                }
            }
        });
    </script>
</body>
</html>
