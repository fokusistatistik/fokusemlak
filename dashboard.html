<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabım | FOKUS Emlak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-50">
    <div id="toast-container" class="fixed top-6 right-4 z-[70] flex flex-col gap-2"></div>

    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-blue-900 rounded-lg flex items-center justify-center text-white font-bold">F</div>
                    <span class="text-2xl font-bold text-blue-900">FOKUS</span>
                </a>
                <button data-auth="logout-btn" class="flex items-center gap-2 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Çıkış Yap
                </button>
            </div>
        </header>

        <div class="container mx-auto px-4 py-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Hoş Geldiniz</h1>
                <p class="text-slate-600">Hesap bilgilerinizi ve favori ilanlarınızı yönetin</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
                    <div class="w-12 h-12 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center mb-4">
                        <i class="fa-solid fa-heart text-xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-1">12</h3>
                    <p class="text-slate-600">Favori İlan</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
                    <div class="w-12 h-12 bg-amber-100 text-amber-900 rounded-full flex items-center justify-center mb-4">
                        <i class="fa-solid fa-eye text-xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-1">45</h3>
                    <p class="text-slate-600">Görüntüleme</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
                    <div class="w-12 h-12 bg-green-100 text-green-900 rounded-full flex items-center justify-center mb-4">
                        <i class="fa-solid fa-bell text-xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-1">3</h3>
                    <p class="text-slate-600">Aktif Bildirim</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-8">
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-xl shadow border border-slate-200 p-6">
                        <h2 class="text-xl font-bold mb-4">Favori İlanlarım</h2>
                        <div class="space-y-4">
                            <div class="flex gap-4 p-4 border border-slate-200 rounded-lg hover:shadow-md transition">
                                <img src="https://images.unsplash.com/photo-1600596542815-2495db98dada?w=150" class="w-24 h-24 object-cover rounded-lg">
                                <div class="flex-1">
                                    <h4 class="font-bold text-slate-900">İzmit Merkez 3+1 Daire</h4>
                                    <p class="text-sm text-slate-500">145 m² • İzmit, Kocaeli</p>
                                    <p class="text-blue-900 font-bold mt-2">₺ 3.750.000</p>
                                </div>
                                <button class="text-red-500 hover:text-red-700"><i class="fa-solid fa-heart"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="bg-white rounded-xl shadow border border-slate-200 p-6">
                        <h2 class="text-xl font-bold mb-4">Hesap Bilgileri</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="text-sm font-semibold text-slate-600">Ad Soyad</label>
                                <p class="text-slate-900" data-auth="user-name">-</p>
                            </div>
                            <div>
                                <label class="text-sm font-semibold text-slate-600">E-posta</label>
                                <p class="text-slate-900 text-sm">test@fokusemlak.com</p>
                            </div>
                            <button class="w-full bg-blue-900 text-white py-2 rounded-lg hover:bg-blue-800 transition">
                                Profili Düzenle
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        if (!Auth.isAuthenticated()) {
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
