    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://fokusemlak.com/listings.html">
    <meta property="og:title" content="Satılık ve Kiralık İlanlar - Kocaeli & Samsun | FOKUS Emlak">
    <meta property="og:description" content="Kocaeli ve Samsun'daki satılık ve kiralık emlak ilanlarını keşfedin. Yapay zeka destekli değerleme sistemi ile güvenli alışveriş.">
    <meta property="og:image" content="https://static.fokusistatistik.com/resimler/fokusemlaklogo.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://fokusemlak.com/listings.html">
    <meta name="twitter:title" content="Satılık ve Kiralık İlanlar | FOKUS Emlak">
    <meta name="twitter:description" content="Kocaeli ve Samsun'daki emlak ilanlarını yapay zeka destekli sistemimizle keşfedin.">
    <meta name="twitter:image" content="https://static.fokusistatistik.com/resimler/fokusemlaklogo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://static.fokusistatistik.com/resimler/fokusemlakfavicon.png">
    <link rel="apple-touch-icon" href="https://static.fokusistatistik.com/resimler/fokusemlakfavicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-50">
    <!-- Simple Nav -->
    <nav class="bg-white border-b border-slate-200">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img src="https://static.fokusistatistik.com/resimler/fokusemlaklogo.png" alt="FOKUS Emlak" class="h-10 w-auto object-contain">
            </a>
            <a href="index.html" class="text-slate-600 hover:text-blue-900"><i class="fa-solid fa-arrow-left mr-2"></i> Ana Sayfa</a>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="bg-white border-b border-slate-200">
        <div class="container mx-auto px-4 py-3">
            <nav aria-label="Breadcrumb" class="text-sm">
                <ol itemscope itemtype="https://schema.org/BreadcrumbList" class="flex items-center gap-2 text-slate-600">
                    <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                        <a itemprop="item" href="/" class="hover:text-blue-900">
                            <span itemprop="name">Ana Sayfa</span>
                        </a>
                        <meta itemprop="position" content="1" />
                    </li>
                    <li><i class="fa-solid fa-chevron-right text-xs"></i></li>
                    <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                        <span itemprop="name" class="text-blue-900 font-medium">İlanlar</span>
                        <meta itemprop="position" content="2" />
                    </li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Satılık ve Kiralık Emlak İlanları</h1>
            <p class="text-slate-600">Toplam <span id="total-count" class="font-bold text-blue-900">0</span> ilan bulundu</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Filters -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow border border-slate-200 sticky top-4">
                    <h3 class="font-bold text-lg mb-4">Filtreler</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-2">İşlem Tipi</label>
                            <select id="filter-type" class="form-input form-select">
                                <option value="">Tümü</option>
                                <option value="satilik">Satılık</option>
                                <option value="kiralik">Kiralık</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-2">İl</label>
                            <select id="filter-city" class="form-input form-select">
                                <option value="">Tümü</option>
                                <option value="Kocaeli">Kocaeli</option>
                                <option value="Samsun">Samsun</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-2">İlçe</label>
                            <select id="filter-district" class="form-input form-select">
                                <option value="">Tümü</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-2">Mülk Tipi</label>
                            <select id="filter-property-type" class="form-input form-select">
                                <option value="">Tümü</option>
                                <option value="daire">Daire</option>
                                <option value="villa">Villa</option>
                                <option value="arsa">Arsa</option>
                                <option value="is-yeri">İşyeri</option>
                            </select>
                        </div>
                        <button onclick="applyFilters()" class="w-full bg-blue-900 text-white py-2.5 rounded-lg hover:bg-blue-800 transition btn-primary">
                            Filtrele
                        </button>
                        <button onclick="clearFilters()" class="w-full bg-slate-100 text-slate-700 py-2.5 rounded-lg hover:bg-slate-200 transition">
                            Temizle
                        </button>
                    </div>
                </div>
            </div>

            <!-- Listings Grid -->
            <div class="lg:col-span-3">
                <div id="listings-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    <!-- Properties will be loaded here dynamically -->
                </div>
                <div id="loading" class="text-center py-12">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-900"></i>
                    <p class="mt-4 text-slate-600">İlanlar yükleniyor...</p>
                </div>
                <div id="no-results" class="hidden text-center py-12 bg-white rounded-xl">
                    <i class="fa-solid fa-search text-4xl text-slate-300 mb-4"></i>
                    <p class="text-slate-600 text-lg">Aramanıza uygun ilan bulunamadı</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/security.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/language.js"></script>
    <script src="/assets/js/analytics.js"></script>
    <script src="/assets/js/chatbot.js"></script>
    <script src="/assets/js/pwa.js"></script>
    <script>
        let allProperties = [];

        async function loadProperties() {
            try {
                // Try to fetch from webhook
                const response = await fetch('https://n8n.fokusistatistik.com/webhook/property/all');
                if (response.ok) {
                    allProperties = await response.json();
                } else {
                    throw new Error('Webhook failed');
                }
            } catch (error) {
                console.warn('Loading from localStorage as fallback');
                // Fallback to localStorage
                allProperties = JSON.parse(localStorage.getItem('properties') || '[]');
            }

            displayProperties(allProperties);
        }

        function displayProperties(properties) {
            const grid = document.getElementById('listings-grid');
            const loading = document.getElementById('loading');
            const noResults = document.getElementById('no-results');
            const totalCount = document.getElementById('total-count');

            loading.classList.add('hidden');
            totalCount.textContent = properties.length;

            if (properties.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            grid.innerHTML = properties.map(property => `
                <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden hover-lift">
                    <div class="relative h-48">
                        <span class="absolute top-4 left-4 ${property.type === 'satilik' ? 'bg-blue-900' : 'bg-amber-500'} text-white text-xs font-bold px-3 py-1 rounded-full z-10">
                            ${property.type === 'satilik' ? 'SATILIK' : 'KİRALIK'}
                        </span>
                        <img src="${property.photos && property.photos[0] ? property.photos[0] : 'https://images.unsplash.com/photo-1600596542815-2495db98dada?w=400'}"
                             class="w-full h-full object-cover"
                             onerror="this.src='https://images.unsplash.com/photo-1600596542815-2495db98dada?w=400'">
                    </div>
                    <div class="p-5">
                        <h4 class="font-bold text-lg mb-2">${property.title}</h4>
                        <p class="text-slate-500 text-sm mb-4">
                            <i class="fa-solid fa-location-dot"></i> ${property.district || property.city}
                        </p>
                        <div class="flex justify-between text-sm text-slate-600 mb-4">
                            <span><i class="fa-solid fa-bed"></i> ${property.rooms || 'N/A'}</span>
                            <span><i class="fa-solid fa-ruler-combined"></i> ${property.area || 0} m²</span>
                        </div>
                        <div class="flex justify-between items-center border-t pt-4">
                            <p class="text-blue-900 font-bold text-xl">
                                ₺ ${formatPrice(property.price)}${property.type === 'kiralik' ? '/ay' : ''}
                            </p>
                            <a href="listing-detail.html?id=${property.id}" class="text-blue-900 hover:text-blue-700">
                                <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('tr-TR').format(price);
        }

        function applyFilters() {
            const type = document.getElementById('filter-type').value;
            const city = document.getElementById('filter-city').value;
            const district = document.getElementById('filter-district').value;
            const propertyType = document.getElementById('filter-property-type').value;

            let filtered = allProperties.filter(property => {
                if (type && property.type !== type) return false;
                if (city && property.city !== city) return false;
                if (district && property.district !== district) return false;
                if (propertyType && property.propertyType !== propertyType) return false;
                return true;
            });

            displayProperties(filtered);
        }

        function clearFilters() {
            document.getElementById('filter-type').value = '';
            document.getElementById('filter-city').value = '';
            document.getElementById('filter-district').value = '';
            document.getElementById('filter-property-type').value = '';
            displayProperties(allProperties);
        }

        // Update district dropdown based on city selection
        document.getElementById('filter-city').addEventListener('change', function() {
            const city = this.value;
            const districtSelect = document.getElementById('filter-district');

            districtSelect.innerHTML = '<option value="">Tümü</option>';

            if (city) {
                const districts = [...new Set(allProperties
                    .filter(p => p.city === city)
                    .map(p => p.district)
                    .filter(Boolean))];

                districts.forEach(district => {
                    districtSelect.innerHTML += `<option value="${district}">${district}</option>`;
                });
            }
        });

        // Load properties on page load
        loadProperties();
    </script>
</body>
</html>
