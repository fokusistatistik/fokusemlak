<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | FOKUS Emlak</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://static.fokusistatistik.com/resimler/fokusemlakfavicon.png">
    <link rel="apple-touch-icon" href="https://static.fokusistatistik.com/resimler/fokusemlakfavicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-50">
    <!-- Simple Nav -->
    <nav class="bg-white border-b border-slate-200">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img src="https://static.fokusistatistik.com/resimler/fokusemlaklogo.png" alt="FOKUS Emlak" class="h-10 w-auto object-contain">
            </a>
            <a href="index.html" class="text-slate-600 hover:text-blue-900"><i class="fa-solid fa-arrow-left mr-2"></i> Ana Sayfa</a>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Blog</h1>
            <p class="text-slate-600">Emlak dünyasından haberler, analizler ve rehberler</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Category Filter -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow border border-slate-200 sticky top-4">
                    <h3 class="font-bold text-lg mb-4">Kategoriler</h3>
                    <div class="space-y-2">
                        <button onclick="filterByCategory('')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-100 transition">
                            <i class="fa-solid fa-grip mr-2"></i> Tümü
                        </button>
                        <button onclick="filterByCategory('market')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-100 transition">
                            <i class="fa-solid fa-chart-line mr-2"></i> Piyasa Analizi
                        </button>
                        <button onclick="filterByCategory('guide')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-100 transition">
                            <i class="fa-solid fa-book mr-2"></i> Rehber
                        </button>
                        <button onclick="filterByCategory('news')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-100 transition">
                            <i class="fa-solid fa-newspaper mr-2"></i> Haberler
                        </button>
                        <button onclick="filterByCategory('investment')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-100 transition">
                            <i class="fa-solid fa-coins mr-2"></i> Yatırım
                        </button>
                        <button onclick="filterByCategory('legal')" class="w-full text-left px-3 py-2 rounded hover:bg-slate-100 transition">
                            <i class="fa-solid fa-gavel mr-2"></i> Hukuki
                        </button>
                    </div>
                </div>
            </div>

            <!-- Blog Grid -->
            <div class="lg:col-span-3">
                <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Blogs will be loaded here -->
                </div>
                <div id="loading" class="text-center py-12">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-900"></i>
                    <p class="mt-4 text-slate-600">Blog yazıları yükleniyor...</p>
                </div>
                <div id="no-results" class="hidden text-center py-12 bg-white rounded-xl">
                    <i class="fa-solid fa-search text-4xl text-slate-300 mb-4"></i>
                    <p class="text-slate-600 text-lg">Bu kategoride blog yazısı bulunamadı</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
        let allBlogs = [];

        async function loadBlogs() {
            try {
                const response = await fetch('https://n8n.fokusistatistik.com/webhook/blog/all');
                if (response.ok) {
                    allBlogs = await response.json();
                } else {
                    throw new Error('Webhook failed');
                }
            } catch (error) {
                console.warn('Loading from localStorage');
                allBlogs = JSON.parse(localStorage.getItem('blogs') || '[]');
            }

            displayBlogs(allBlogs);
        }

        function displayBlogs(blogs) {
            const grid = document.getElementById('blog-grid');
            const loading = document.getElementById('loading');
            const noResults = document.getElementById('no-results');

            loading.classList.add('hidden');

            if (blogs.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            grid.innerHTML = blogs.map(blog => `
                <article class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden hover-lift">
                    <div class="relative h-48">
                        <img src="${blog.image || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600'}"
                             class="w-full h-full object-cover"
                             onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600'">
                        <span class="absolute top-4 left-4 bg-blue-900 text-white text-xs font-bold px-3 py-1 rounded-full">
                            ${getCategoryLabel(blog.category)}
                        </span>
                    </div>
                    <div class="p-6">
                        <h3 class="font-bold text-xl mb-3 text-slate-900 hover:text-blue-900 transition">
                            <a href="blog-detail.html?id=${blog.id}">${blog.title}</a>
                        </h3>
                        <p class="text-slate-600 text-sm mb-4 line-clamp-3">${blog.excerpt || ''}</p>
                        <div class="flex items-center justify-between text-sm text-slate-500 border-t pt-4">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-user-circle"></i>
                                <span>${blog.author || 'FOKUS Emlak'}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-calendar"></i>
                                <span>${formatDate(blog.date)}</span>
                            </div>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function getCategoryLabel(category) {
            const labels = {
                'market': 'Piyasa Analizi',
                'guide': 'Rehber',
                'news': 'Haberler',
                'investment': 'Yatırım',
                'legal': 'Hukuki'
            };
            return labels[category] || 'Genel';
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function filterByCategory(category) {
            const filtered = category ? allBlogs.filter(b => b.category === category) : allBlogs;
            displayBlogs(filtered);
        }

        // Load blogs on page load
        loadBlogs();
    </script>
</body>
</html>
