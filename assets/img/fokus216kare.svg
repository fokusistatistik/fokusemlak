<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1e3a8a" rx="20"/>

  <!-- Chat bubble -->
  <g transform="translate(100, 90)">
    <!-- Main bubble -->
    <rect x="-60" y="-40" width="120" height="70" rx="15" fill="#ffffff"/>

    <!-- Bubble tail -->
    <path d="M -20 30 L -15 45 L -5 30 Z" fill="#ffffff"/>

    <!-- Eyes -->
    <circle cx="-25" cy="-15" r="8" fill="#1e3a8a"/>
    <circle cx="25" cy="-15" r="8" fill="#1e3a8a"/>

    <!-- Smile -->
    <path d="M -30 0 Q 0 15 30 0" stroke="#1e3a8a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- FOKUS216 text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">FOKUS216</text>
</svg>
