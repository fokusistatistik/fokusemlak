<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi | FOKUS Emlak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-gradient-to-br from-blue-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div id="toast-container" class="fixed top-6 right-4 z-[70] flex flex-col gap-2"></div>

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-2xl">
                <span class="text-4xl font-bold text-blue-900">F</span>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Admin Paneli</h1>
            <p class="text-blue-200">FOKUS Emlak Yönetim Sistemi</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <form onsubmit="handleAdminLogin(event)" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Kullanıcı Adı</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-slate-400"></i>
                        </div>
                        <input
                            type="text"
                            name="username"
                            required
                            placeholder="admin"
                            class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-900 focus:ring-2 focus:ring-blue-900/20"
                        >
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Şifre</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input
                            type="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-900 focus:ring-2 focus:ring-blue-900/20"
                        >
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3.5 rounded-xl hover:bg-blue-800 transition shadow-lg">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Giriş Yap
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-200">
                <p class="text-xs text-slate-500 text-center mb-3">Demo Hesap:</p>
                <div class="bg-slate-50 p-3 rounded-lg text-center">
                    <p class="text-sm font-mono text-slate-700"><strong>Kullanıcı:</strong> admin</p>
                    <p class="text-sm font-mono text-slate-700"><strong>Şifre:</strong> 123</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="/index.html" class="text-white hover:text-blue-200 text-sm font-medium">
                <i class="fa-solid fa-arrow-left mr-2"></i> Ana Sayfaya Dön
            </a>
        </div>
    </div>

    <script src="/assets/js/main.js"></script>
    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();
            const form = event.target;
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Kontrol ediliyor...';

            const username = form.username.value;
            const password = form.password.value;

            setTimeout(() => {
                if (username === 'admin' && password === '123') {
                    localStorage.setItem('admin_token', 'admin_' + Date.now());
                    localStorage.setItem('admin_user', JSON.stringify({
                        username: 'admin',
                        role: 'admin',
                        name: 'FOKUS Admin'
                    }));

                    showToast('Giriş başarılı! Yönlendiriliyorsunuz...', 'success');

                    setTimeout(() => {
                        window.location.href = '/admin/index.html';
                    }, 1000);
                } else {
                    showToast('Kullanıcı adı veya şifre hatalı!', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }, 800);
        }
    </script>
</body>
</html>
