<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | FOKUS Emlak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-50">
    <div id="toast-container" class="fixed top-6 right-4 z-[70] flex flex-col gap-2"></div>
    
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-gradient-to-b from-blue-900 to-slate-900 text-white p-6">
            <div class="mb-8">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-blue-900 font-bold">F</div>
                    <span class="text-xl font-bold">FOKUS Admin</span>
                </div>
                <p class="text-sm text-blue-200">Yönetim Paneli</p>
            </div>
            
            <nav class="space-y-2">
                <a href="#dashboard" onclick="showTab('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
                <a href="#properties" onclick="showTab('properties')" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition bg-white/10">
                    <i class="fa-solid fa-building"></i> İlanlar
                </a>
                <a href="#users" onclick="showTab('users')" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-users"></i> Kullanıcılar
                </a>
                <a href="#analytics" onclick="showTab('analytics')" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-chart-pie"></i> Analitik
                </a>
            </nav>
            
            <div class="absolute bottom-6 left-6 right-6">
                <a href="/" class="block text-center text-sm text-blue-200 hover:text-white">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Siteye Dön
                </a>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="flex-1 p-8">
            <div class="mb-8 flex justify-between items-center">
                <h1 class="text-3xl font-bold text-slate-900">İlan Yönetimi</h1>
                <button onclick="openAddPropertyModal()" class="bg-blue-900 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-800 transition">
                    <i class="fa-solid fa-plus mr-2"></i> Yeni İlan
                </button>
            </div>
            
            <!-- Stats -->
            <div class="grid grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow border">
                    <div class="text-3xl font-bold text-blue-900">24</div>
                    <div class="text-slate-600 text-sm">Toplam İlan</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border">
                    <div class="text-3xl font-bold text-green-600">18</div>
                    <div class="text-slate-600 text-sm">Aktif İlan</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border">
                    <div class="text-3xl font-bold text-amber-600">1.5K</div>
                    <div class="text-slate-600 text-sm">Görüntülenme</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border">
                    <div class="text-3xl font-bold text-purple-600">89</div>
                    <div class="text-slate-600 text-sm">Favori</div>
                </div>
            </div>
            
            <!-- Properties Table -->
            <div class="bg-white rounded-xl shadow border">
                <div class="p-6 border-b">
                    <input type="text" placeholder="İlan ara..." class="w-full px-4 py-2 border rounded-lg">
                </div>
                <table class="w-full">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-bold text-slate-600 uppercase">İlan</th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-slate-600 uppercase">Konum</th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-slate-600 uppercase">Fiyat</th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-slate-600 uppercase">Durum</th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-slate-600 uppercase">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="propertiesTable">
                        <tr class="border-b hover:bg-slate-50">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <img src="https://images.unsplash.com/photo-1600596542815-2495db98dada?w=100" class="w-12 h-12 rounded-lg object-cover">
                                    <div>
                                        <div class="font-medium">İzmit Merkez 3+1</div>
                                        <div class="text-xs text-slate-500">145 m²</div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-sm text-slate-600">İzmit, Kocaeli</td>
                            <td class="px-6 py-4 font-bold text-blue-900">₺ 3.750.000</td>
                            <td class="px-6 py-4"><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-bold">Aktif</span></td>
                            <td class="px-6 py-4">
                                <button class="text-blue-600 hover:text-blue-900 mr-3"><i class="fa-solid fa-edit"></i></button>
                                <button class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Add Property Modal -->
    <div id="addPropertyModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b flex justify-between items-center sticky top-0 bg-white">
                <h2 class="text-2xl font-bold">Yeni İlan Ekle</h2>
                <button onclick="closeAddPropertyModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            <form id="addPropertyForm" onsubmit="handleAddProperty(event)" class="p-6 space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold mb-2">Başlık</label>
                        <input type="text" name="title" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">İşlem Tipi</label>
                        <select name="operation" class="w-full px-4 py-2 border rounded-lg">
                            <option>Satılık</option>
                            <option>Kiralık</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Fiyat (TL)</label>
                        <input type="number" name="price" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">m²</label>
                        <input type="number" name="area" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Oda Sayısı</label>
                        <select name="rooms" class="w-full px-4 py-2 border rounded-lg">
                            <option>1+1</option>
                            <option>2+1</option>
                            <option>3+1</option>
                            <option>4+1</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Şehir</label>
                        <select name="city" class="w-full px-4 py-2 border rounded-lg">
                            <option>Kocaeli</option>
                            <option>Samsun</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Açıklama</label>
                    <textarea name="description" rows="4" class="w-full px-4 py-2 border rounded-lg"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Video URL (YouTube)</label>
                    <input type="url" name="videoUrl" placeholder="https://youtube.com/watch?v=..." class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Fotoğraflar</label>
                    <input type="file" multiple accept="image/*" class="w-full px-4 py-2 border rounded-lg">
                </div>
                <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-xl hover:bg-blue-800 transition">
                    <i class="fa-solid fa-save mr-2"></i> İlanı Kaydet
                </button>
            </form>
        </div>
    </div>
    
    <script src="/assets/js/main.js"></script>
    <script>
        function showTab(tab) { console.log('Tab:', tab); }
        function openAddPropertyModal() { document.getElementById('addPropertyModal').classList.remove('hidden'); }
        function closeAddPropertyModal() { document.getElementById('addPropertyModal').classList.add('hidden'); }
        
        async function handleAddProperty(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('https://n8n.fokusistatistik.com/webhook/property/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    showToast('İlan başarıyla eklendi!', 'success');
                    closeAddPropertyModal();
                    event.target.reset();
                } else {
                    throw new Error('İlan eklenemedi');
                }
            } catch (error) {
                showToast('Bir hata oluştu: ' + error.message, 'error');
            }
        }
        
        // Check admin auth
        if (!localStorage.getItem('admin_token')) {
            window.location.href = '/admin/login.html';
        }
    </script>
</body>
</html>
