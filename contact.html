<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | FOKUS Emlak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-50">
    <div id="toast-container" class="fixed top-6 right-4 z-[70] flex flex-col gap-2"></div>

    <nav class="bg-white border-b border-slate-200">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-blue-900 rounded-lg flex items-center justify-center text-white font-bold">F</div>
                <span class="text-2xl font-bold text-blue-900">FOKUS</span>
            </a>
            <a href="index.html" class="text-slate-600 hover:text-blue-900"><i class="fa-solid fa-arrow-left mr-2"></i> Ana Sayfa</a>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-12">
        <div class="max-w-5xl mx-auto">
            <div class="text-center mb-12">
                <h1 class="text-4xl font-bold text-slate-900 mb-4">İletişim</h1>
                <p class="text-slate-600 text-lg">Size nasıl yardımcı olabiliriz?</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div>
                    <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
                        <h3 class="text-2xl font-bold mb-6">Bize Ulaşın</h3>
                        <form onsubmit="handleContactSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Ad Soyad</label>
                                <input type="text" name="name" required class="form-input">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">E-posta</label>
                                <input type="email" name="email" required class="form-input">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Telefon</label>
                                <input type="tel" name="phone" required class="form-input">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Mesajınız</label>
                                <textarea name="message" rows="4" required class="form-input"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-xl hover:bg-blue-800 transition btn-primary">
                                Gönder <i class="fa-solid fa-paper-plane ml-2"></i>
                            </button>
                        </form>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-white rounded-xl p-6 shadow border border-slate-200">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-phone text-xl"></i>
                            </div>
                            <div>
                                <div class="font-bold">Telefon</div>
                                <div class="text-slate-600">+90 (850) 555 00 00</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl p-6 shadow border border-slate-200">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-envelope text-xl"></i>
                            </div>
                            <div>
                                <div class="font-bold">E-posta</div>
                                <div class="text-slate-600">info@fokusemlak.com</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl p-6 shadow border border-slate-200">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-location-dot text-xl"></i>
                            </div>
                            <div>
                                <div class="font-bold">Ofislerimiz</div>
                                <div class="text-slate-600 text-sm">Merkez: İzmit, Kocaeli<br>Şube: Atakum, Samsun</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/security.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/language.js"></script>
    <script src="/assets/js/analytics.js"></script>
    <script src="/assets/js/chatbot.js"></script>
    <script src="/assets/js/pwa.js"></script>
    <script>
        async function handleContactSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Gönderiliyor...';

            const formData = {
                name: form.name.value,
                email: form.email.value,
                phone: form.phone.value,
                message: form.message.value
            };

            try {
                const response = await API.submitContact(formData);
                if (response.success) {
                    showToast('Mesajınız alındı! En kısa sürede dönüş yapacağız.', 'success');
                    form.reset();
                }
            } catch (error) {
                showToast('Bir hata oluştu. Lütfen tekrar deneyin.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
